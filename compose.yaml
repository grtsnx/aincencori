# Local Postgres, Valkey and Mailpit for this project. Start them with `docker compose up -d --wait`.
# It listens on 5433 so it can run beside other projects that use 5432.
# The address matches DATABASE_URL in .env.example.
name: aincencori

services:
  postgres:
    image: postgres:17-alpine
    container_name: aincencori-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentic']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Valkey (open-source Redis) for background jobs and routines. Port 6380.
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: aincencori-valkey
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Catches every email locally. Inbox: http://localhost:8025 (SMTP on 1025).
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: aincencori-mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
