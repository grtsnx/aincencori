# Local Postgres, PgBouncer, Valkey, MinIO and Mailpit for this project. Start them with `docker compose up -d --wait`.
# It listens on 5433 so it can run beside other projects that use 5432.
# The address matches DATABASE_URL in .env.example.
name: aincencori

services:
  postgres:
    image: postgres:17-alpine
    container_name: aincencori-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentic']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # PgBouncer: a connection pooler in front of Postgres. The app connects
  # here (port 6433), so many servers can share a few real connections.
  # Migrations go straight to Postgres (DIRECT_DATABASE_URL, port 5433).
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: aincencori-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: agentic
      AUTH_TYPE: scram-sha-256
      # A connection is lent for one transaction, then given back.
      POOL_MODE: transaction
      # App connections allowed in, and real Postgres connections used.
      MAX_CLIENT_CONN: '1000'
      DEFAULT_POOL_SIZE: '20'
    ports:
      - '127.0.0.1:6433:5432'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Valkey (open-source Redis) for background jobs and routines. Port 6380.
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: aincencori-valkey
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO: S3-compatible file storage for chat attachments. Port 9000
  # (console: http://localhost:9001, minioadmin / minioadmin).
  minio:
    image: cgr.dev/chainguard/minio@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
    container_name: aincencori-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Catches every email locally. Inbox: http://localhost:8025 (SMTP on 1025).
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: aincencori-mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  minio-data:
